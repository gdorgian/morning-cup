}

      html = await unlock(page.match(/unlock("([^"]+)", "([^"]+)")/)[1], page.match(/unlock("([^"]+)", "([^"]+)")/)[2]);
    } catch { document.getElementById("m").textContent = "🔒"; return; }
  }
  const doc = new DOMParser().parseFromString(html, "text/html"); // swap in the whole paper
  document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
})();
</script></body></html>
